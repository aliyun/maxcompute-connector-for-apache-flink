# 测试日志配置
log4j.rootLogger=INFO,console

# 控制台输出
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.Threshold=INFO
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%p][%d{HH:mm:ss}][%c{1}] %m%n

# MaxComputeSinkWriter 单独设置为 INFO，确保能看到 timer/flush 相关日志
log4j.logger.org.apache.flink.odps.sink.datastream=INFO

# 其他 Flink 日志可以设为 WARN 减少噪音
log4j.logger.org.apache.flink=WARN
log4j.logger.org.apache.flink.odps=INFO
