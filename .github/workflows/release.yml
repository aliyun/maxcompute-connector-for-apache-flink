name: Stage approved Maven release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Approved public release tag
        required: true
permissions:
  contents: read
jobs:
  stage:
    # A public source repository and a protected maven-central environment are prerequisites.
    if: github.event.repository.private == false
    environment: maven-central
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      PUBLIC_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
      APPROVAL_REFERENCE: ${{ vars.OPEN_SOURCE_APPROVAL_REFERENCE }}
      APPROVED_KEY_FINGERPRINT: ${{ vars.GPG_KEY_FINGERPRINT }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      ODPS_ACCESS_ID: ${{ secrets.MAXCOMPUTE_ACCESS_ID }}
      ODPS_ACCESS_KEY: ${{ secrets.MAXCOMPUTE_ACCESS_KEY }}
      ODPS_SECURITY_TOKEN: ${{ secrets.MAXCOMPUTE_SECURITY_TOKEN }}
      MAXCOMPUTE_PROJECT: ${{ vars.MAXCOMPUTE_TEST_PROJECT }}
      MAXCOMPUTE_ENDPOINT: ${{ vars.MAXCOMPUTE_TEST_ENDPOINT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Verify required identity and exact tag
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          required = ['APPROVAL_REFERENCE', 'APPROVED_KEY_FINGERPRINT', 'MAVEN_USERNAME',
                      'MAVEN_PASSWORD', 'ODPS_ACCESS_ID', 'ODPS_ACCESS_KEY',
                      'MAXCOMPUTE_PROJECT', 'MAXCOMPUTE_ENDPOINT']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing protected release configuration: ' + ', '.join(missing))
          PYTHON
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Check strict source and dependency closure before staging
        shell: bash
        run: |
          mvn -s tools/maven-central-settings.xml -gs tools/maven-central-settings.xml \
            -B -ntp -Ppublic org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree \
            -DoutputType=json -DoutputFile=target/public-dependency-tree.json
          for line in 1.16 1.17 1.20; do
            python3 tools/check-public.py --release --flink-line "$line"
          done
      - name: Test, sign and stage for manual Central publication
        shell: bash
        run: |
          mvn -gs tools/maven-central-settings.xml -B -ntp -Ppublic,release-artifacts,release \
            -Dconnector.release.approval="$APPROVAL_REFERENCE" \
            -Dconnector.scm.url="$PUBLIC_SOURCE_URL" \
            -Dconnector.scm.connection="scm:git:$PUBLIC_SOURCE_URL.git" \
            -Dconnector.scm.tag="$RELEASE_TAG" \
            -Dgpg.keyname="$APPROVED_KEY_FINGERPRINT" \
            -Dmaxcompute.e2e.allow-write=true clean deploy
      - name: Verify signatures and record distributed artifact hashes
        shell: bash
        run: |
          shopt -s nullglob
          signatures=(target/*.asc flink/1.16/target/*.asc flink/1.17/target/*.asc flink/1.20/target/*.asc)
          test "${#signatures[@]}" -ge 4
          for signature in "${signatures[@]}"; do
            gpg --batch --verify "$signature" "${signature%.asc}"
          done
          sha256sum flink/*/target/*.jar "${signatures[@]}" > target/release-sha256.txt
