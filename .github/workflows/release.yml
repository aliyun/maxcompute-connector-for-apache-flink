name: Check Maven signing key
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Create an isolated signing keyring
        shell: bash
        run: |
          keyring=$(mktemp -d "$RUNNER_TEMP/signing-probe.XXXXXX")
          printf 'GNUPGHOME=%s\n' "$keyring" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Report signing key validity
        shell: bash
        run: |
          key_records="$RUNNER_TEMP/key-records"
          gpg --batch --with-colons --list-options show-unusable-subkeys --list-secret-keys > "$key_records"
          python3 - "$key_records" <<'PYTHON'
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          for line in Path(sys.argv[1]).read_text().splitlines():
              record = line.split(':')
              if record[0] not in ('sec', 'ssb'):
                  continue
              expiry = datetime.fromtimestamp(int(record[6]), timezone.utc) if record[6] else None
              local_secret = record[14] == '+'
              print(f"{record[0]} expired={bool(expiry and expiry <= datetime.now(timezone.utc))}"
                    f" revoked={record[1] == 'r'} local_secret={local_secret}"
                    f" signing_capability={'s' in record[11]} expires_utc={expiry or 'none'}")
          PYTHON
          fingerprint=$(awk -F: '$1 == "sec" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }' "$key_records")
          [[ "$fingerprint" =~ ^[0-9A-Fa-f]{40}$ ]]
          printf '%s\n' 'Disposable signing probe' > "$RUNNER_TEMP/signing-probe.txt"
          if printf '%s\n' "$MAVEN_GPG_PASSPHRASE" |
              gpg --batch --pinentry-mode loopback --passphrase-fd 0 --local-user "$fingerprint" \
                --status-fd 1 --output "$RUNNER_TEMP/signing-probe.sig" --detach-sign \
                "$RUNNER_TEMP/signing-probe.txt" > "$RUNNER_TEMP/signing-status" 2> "$RUNNER_TEMP/signing-errors"; then
            echo "Disposable signature created successfully."
          else
            awk '$1 == "[GNUPG:]" && $2 ~ /^(KEYEXPIRED|KEYREVOKED|INV_SGNR|BAD_PASSPHRASE|NO_SECKEY|FAILURE)$/ { print $2, $3 }' "$RUNNER_TEMP/signing-status"
            echo "::error::The imported key could not sign the disposable probe."
            exit 1
          fi
